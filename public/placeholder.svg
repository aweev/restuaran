<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Dish placeholder">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2118"/>
      <stop offset="55%" stop-color="#4a3826"/>
      <stop offset="100%" stop-color="#1d1712"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#7a5a33" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a5a33" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#plate)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- plate rim -->
  <circle cx="200" cy="205" r="118" fill="none" stroke="#c9a227" stroke-opacity="0.28" stroke-width="3"/>
  <circle cx="200" cy="205" r="96" fill="none" stroke="#c9a227" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- cutlery marks -->
  <g stroke="#c9a227" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round">
    <path d="M92 150 v100"/>
    <path d="M86 150 v26 M92 150 v26 M98 150 v26"/>
    <path d="M308 150 v100"/>
    <path d="M302 150 v34 M308 150 v34 M314 150 v34"/>
  </g>

  <!-- steam -->
  <g stroke="#e8dcc8" stroke-opacity="0.20" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M172 120 c-10 -14 10 -22 0 -36"/>
    <path d="M200 110 c-10 -16 10 -24 0 -40"/>
    <path d="M228 120 c-10 -14 10 -22 0 -36"/>
  </g>
</svg>
